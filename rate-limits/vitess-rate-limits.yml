specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Vitess
providerId: vitess
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Open Source
  - Database
  - MySQL
description: Vitess is open-source software, not a hosted API; there is no project-level
  rate-limit table to publish. Throughput is governed by the operator's deployment - vtgate
  configuration, MySQL backend capacity, and any rate-limit middleware the operator adds.
sources:
  - https://vitess.io/docs/
responseCodes: {}
limits:
  - name: Operator-defined (vtgate)
    scope: deployment
    metric: varies
    limit: governed by the operator's vtgate / vtablet configuration and backend MySQL capacity
policies:
  - name: Operator-controlled
    description: Vitess exposes knobs (transaction pools, query consolidator, hot-row protection,
      vtgate connection limits) that the operator tunes; there is no shared, hosted rate ceiling.
  - name: Backend-bound
    description: Sustained throughput is ultimately bounded by the underlying MySQL shards and the
      Kubernetes / VM infrastructure they run on.
maintainers:
