description: Vitess is a Cloud Native Computing Foundation graduated project for scaling MySQL.
  The project itself is open source under the Apache 2.0 license and has no commercial pricing -
  consumers self-host it or pay a vendor (e.g. PlanetScale historically) that builds a managed
  service on top. The artifact retains a single Contact Sales placeholder pointing to that
  reality; there is no first-party "Vitess" plan to reconcile.
