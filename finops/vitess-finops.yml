description: Vitess is an Apache-2.0 open-source project; there is no project-level invoice or
  metered billing surface. Operator cost lives in the underlying compute / storage / network
  resources that run Vitess and its MySQL shards, which are reported by the underlying cloud
  provider's FOCUS feed.
sources:
  - https://vitess.io/
notes: No commercial billing surface. Treat Vitess cost as a workload allocation against the
  hosting cloud's compute, storage, and network meters.
billingModel:
  pricingCategory: Open Source (Apache 2.0)
  billingFrequency: N/A
  billingCurrency: USD
  chargeCategories: []
focusColumns:
  ServiceName: Vitess
  ServiceCategory: Open Source Database
  ProviderName: Cloud Native Computing Foundation
  PublisherName: Cloud Native Computing Foundation
  BillingCurrency: USD
meters:
  - name: compute_hours
    unit: instance-hour
    aggregation: sum
    dimensions:
      - role
      - instance_type
  - name: storage_capacity
    unit: GB-month
    aggregation: max
    dimensions:
      - shard
  - name: network_egress
    unit: GB
    aggregation: sum
    dimensions:
      - direction
principles:
  - name: Visibility
    description: Visibility comes from the hosting cloud's cost-and-usage report and from Vitess
      operational dashboards (vtgate / vtablet metrics, query stats); there is no Vitess-issued
      invoice.
  - name: Allocation
    description: Tag the cloud resources that run Vitess (Kubernetes namespace, instance group,
      EBS volume) with the consuming workload to attribute cost back to product teams.
  - name: Optimization
    description: Levers are infrastructure-driven - shard right-sizing, autoscaling vtgate,
      reserved-instance commitments on the MySQL backends, query consolidator tuning, and shard
      consolidation as workloads shrink.
  - name: Accountability
    description: The platform / database team that operates the Vitess deployment owns the cost
      line; finance allocates back to consuming teams via tagging rules.
maintainers:
